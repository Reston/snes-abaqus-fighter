tor("nav"),content=document.querySelector("#content");function select(id){const g=groups.find(x=>x.id===id);for(const b of nav.children)b.setAttribute("aria-selected",String(b.dataset.id===id));content.replaceChildren();const p=document.createElement("p");p.textContent=g.text;content.append(p);const shots=document.createElement("div");shots.className="shots";for(const im of g.images){const f=document.createElement("figure"),img=document.createElement("img"),c=document.createElement("figcaption");img.src=im.src;img.alt=im.caption;img.width=256;img.height=224;c.textContent=im.caption;f.append(img,c);shots.append(f)}content.append(shots);document.querySelector("#identity").textContent=g.images.map(im=>im.caption+": "+im.rom_sha256).join(" | ")}for(const g of groups){const b=document.createElement("button");b.textContent=g.label;b.dataset.id=g.id;b.setAttribute("role","tab");b.onclick=()=>select(g.id);nav.append(b)}select("local");window.addEventListener("load",()=>console.log(JSON.stringify({images:document.images.length,loaded:[...document.images].every(x=>x.complete&&x.naturalWidth>0),overflow:document.documentElement.scrollWidth>innerWidth})));</script></body></html>
