<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground)}*{box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{margin-top:8px;font-size:13px}.frame{background:#071020;padding:12px;border-radius:8px}.frame img{display:block;width:100%;height:auto;image-rendering:pixelated}.frame .still{display:none}body.paused .frame .moving{display:none}body.paused .frame .still{display:block}button{font:inherit;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:6px;padding:7px 12px;cursor:pointer}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.note{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin:16px 0 0}@media(max-width:460px){.grid{gap:10px}.frame{padding:6px}}</style></head><body>
<div class="controls"><button id="toggle" type="button">Pause motion</button><span>Damian · both facing directions</span></div>
<div class="grid"><figure><div class="frame"><img class="moving" alt="Air kick · player 1 native animation" src="screenshots/characters/00-p1-air-b.gif"><img class="still" alt="Air kick · player 1 first native frame" src="screenshots/damian-v5/00-p1-air-b-still.png"></div><figcaption>Air kick · player 1</figcaption></figure><figure><div class="frame"><img class="moving" alt="Air kick · player 2 native animation" src="screenshots/characters/00-p2-air-b.gif"><img class="still" alt="Air kick · player 2 first native frame" src="screenshots/damian-v5/00-p2-air-b-still.png"></div><figcaption>Air kick · player 2</figcaption></figure><figure><div class="frame"><img class="moving" alt="Throw · player 1 native animation" src="screenshots/characters/00-p1-throw-sequence.gif"><img class="still" alt="Throw · player 1 first native frame" src="screenshots/damian-v5/00-p1-throw-sequence-still.png"></div><figcaption>Throw · player 1</figcaption></figure><figure><div class="frame"><img class="moving" alt="Throw · player 2 native animation" src="screenshots/characters/00-p2-throw-sequence.gif"><img class="still" alt="Throw · player 2 first native frame" src="screenshots/damian-v5/00-p2-throw-sequence-still.png"></div><figcaption>Throw · player 2</figcaption></figure></div>
<p class="note">Silent native captures from the v0.20.0 likeness review ROM. Desktop control was unavailable; these are existing headless captures. The user accepted the revised likeness on 2026-10-22.</p>
<script>const button=document.querySelector('#toggle');function pause(value){document.body.classList.toggle('paused',value);button.textContent=value?'Play motion':'Pause motion';button.setAttribute('aria-pressed',String(value));}button.onclick=()=>pause(!document.body.classList.contains('paused'));pause(matchMedia('(prefers-reduced-motion: reduce)').matches);Promise.all([...document.images].map(i=>i.decode())).then(()=>{console.log(JSON.stringify({images:document.images.length,loaded:[...document.images].every(i=>i.naturalWidth===256&&i.naturalHeight===224),overflow:document.documentElement.scrollWidth>innerWidth}));});</script>
</body></html>
