# Abaqus After Hours defaults. Snes9x saves later changes in .tools/snes9x.
[Display\Win]
OutputMethod = 2
FilterType = 0
FilterHiRes = 0
ShaderEnabled = FALSE
ExtendHeight = FALSE
Window:Width = 1024
Window:Height = 896
Window:Left = 100
Window:Top = 60
Stretch:Enabled = TRUE
Stretch:MaintainAspectRatio = TRUE
Stretch:IntegerScaling = TRUE
Stretch:AspectRatioBaseWidth = 256
Stretch:BilinearFilter = FALSE

[Settings\Win]
AddToRegistry = FALSE
PauseWhenInactive = TRUE

[Controls]
# Deliver both directions so the game's native SOCD policy resolves them.
AllowLeftRight = TRUE

[Controls\Win]
Joypad1:Enabled = TRUE
Joypad1:Up = Up
Joypad1:Down = Down
Joypad1:Left = Left
Joypad1:Right = Right
Joypad1:Y = A
Joypad1:X = S
Joypad1:L = D
Joypad1:B = Z
Joypad1:A = X
Joypad1:R = C
Joypad1:Start = Enter
Joypad1:Select = Shift
Joypad2:Enabled = TRUE
Joypad2:Up = I
Joypad2:Down = K
Joypad2:Left = J
Joypad2:Right = L
Joypad2:Y = Pad7
Joypad2:X = Pad8
Joypad2:L = Pad9
Joypad2:B = Pad1
Joypad2:A = Pad2
Joypad2:R = Pad3
Joypad2:Start = Space
Joypad2:Select = Q
